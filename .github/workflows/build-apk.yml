name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Standalone Android APK
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 📦 Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🤖 Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 📥 Install Monorepo Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: 📦 Build Shared Packages
        run: pnpm --filter @crmkaro/contracts build && pnpm --filter @crmkaro/permissions build

      - name: 🛠️ Prebuild Native Android
        working-directory: apps/mobile
        run: |
          npx expo prebuild --platform android --clean --no-install
          echo "org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m" >> android/gradle.properties
          echo "kotlin.compiler.execution.strategy=in-process" >> android/gradle.properties
          echo "kotlin.incremental=false" >> android/gradle.properties

      - name: 🏗️ Build Standalone Debug APK
        working-directory: apps/mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace --info

      - name: 📤 Upload CRMKaro APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CRMKaro-Android-App-APK
          path: apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
